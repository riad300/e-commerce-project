<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="stylesheet" href="css/main.css" />
  <title>Checkout</title>
  <style>
    .checkout-wrap{max-width:900px;margin:40px auto;padding:0 16px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .card{border:1px solid #eee;border-radius:10px;padding:18px;background:#fff}
    .card h3{margin:0 0 12px}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    .field input, .field select, .field textarea{padding:10px;border:1px solid #ddd;border-radius:8px}
    .total{font-size:20px;font-weight:700}
    @media(max-width:820px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>

  <div class="checkout-wrap">
    <h2>Checkout</h2>

    <div class="row">
      <!-- Shipping -->
      <div class="card">
        <h3>Shipping Details</h3>
        <div class="field"><label>Name</label><input id="name" type="text" placeholder="Full name"></div>
        <div class="field"><label>Phone</label><input id="phone" type="text" placeholder="01XXXXXXXXX"></div>
        <div class="field"><label>Address</label><textarea id="address" rows="3" placeholder="Full delivery address"></textarea></div>
        <div class="field"><label>City</label><input id="city" type="text" placeholder="Dhaka"></div>

        <div class="field">
          <label>Payment Method</label>
          <select id="paymentMethod">
            <option value="cod">Cash on Delivery (COD)</option>
            <option value="link">Online Payment (Redirect Link)</option>
          </select>
        </div>

        <small id="hint" style="display:block;margin-top:8px;color:#555;">
          COD select করলে অর্ডার confirm হবে। Online Payment select করলে payment link এ নিয়ে যাবে।
        </small>
      </div>

      <!-- Summary -->
      <div class="card">
        <h3>Order Summary</h3>
        <div id="itemsBox">Loading...</div>
        <hr style="margin:14px 0;">
        <div class="total">Total: <span id="totalBox">$0.00</span></div>

        <div style="margin-top:16px;">
          <button class="btn btn-lg btn-red" id="placeOrderBtn">Place Order</button>
          <p id="msg" style="margin-top:10px;"></p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const itemsBox = document.getElementById("itemsBox");
    const totalBox = document.getElementById("totalBox");
    const msg = document.getElementById("msg");

    const placeOrderBtn = document.getElementById("placeOrderBtn");
    const paymentMethod = document.getElementById("paymentMethod");

    // তোমার cart key = "cart"
    function readCart() {
      try { return JSON.parse(localStorage.getItem("cart")) || []; }
      catch { return []; }
    }
    function calcTotal(cart) {
      return cart.reduce((sum, it) => sum + (it.price?.newPrice || 0) * (it.quantity || 1), 0);
    }
    function render(cart) {
      if (!cart.length) {
        itemsBox.innerHTML = "<p>Your cart is empty.</p>";
        totalBox.textContent = "$0.00";
        return;
      }
      let html = "<ul style='padding-left:18px;'>";
      cart.forEach(it => {
        html += `<li>${it.name} × ${it.quantity} — $${(it.price.newPrice * it.quantity).toFixed(2)}</li>`;
      });
      html += "</ul>";
      itemsBox.innerHTML = html;

      const total = calcTotal(cart);
      totalBox.textContent = "$" + total.toFixed(2);
    }

    let currentUser = null;
    let cart = readCart();
    render(cart);

    // ✅ Profile system: login না থাকলে account page
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (!user) {
        window.location.href = "account.html";
      }
    });

    // ✅ Online payment link (এখানে তোমার link বসাবে)
    const PAYMENT_LINK_URL = "https://buy.stripe.com/REPLACE_WITH_YOUR_LINK"; 
    // অথবা SSLCOMMERZ/bKash hosted checkout link

    placeOrderBtn.addEventListener("click", async () => {
      msg.textContent = "";
      cart = readCart();
      if (!cart.length) { msg.textContent = "Cart empty."; return; }

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();
      const city = document.getElementById("city").value.trim();

      if (!name || !phone || !address) {
        msg.textContent = "Name, phone, address required.";
        return;
      }
      if (!currentUser) return;

      const total = calcTotal(cart);
      const orderId = "ORD-" + Date.now();

      // ✅ 1) Order save to Firestore (no backend)
      await setDoc(doc(db, "users", currentUser.uid, "orders", orderId), {
        orderId,
        items: cart,
        total,
        currency: "USD",
        status: paymentMethod.value === "cod" ? "placed" : "pending_payment",
        shipping: { name, phone, address, city },
        createdAt: Date.now()
      });

      // ✅ 2) Payment method logic
      if (paymentMethod.value === "cod") {
        localStorage.setItem("cart", JSON.stringify([])); // clear cart
        msg.textContent = "✅ Order placed (COD). Redirecting to profile...";
        setTimeout(() => window.location.href = "profile.html", 900);
        return;
      }

      // Online link redirect
      msg.textContent = "Redirecting to payment...";
      window.location.href = PAYMENT_LINK_URL;
    });
  </script>
</body>
</html>
