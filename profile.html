<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<section class="account-page">
  <div class="container">
    <div class="account-wrapper">

      <!-- Left menu -->
      <div class="account-column">
        <h2>My Account</h2>
        <p style="margin-top:10px;">
          <strong id="userName">—</strong><br>
          <span id="userEmail">—</span>
        </p>

        <ul class="menu-list" style="margin-top:15px;">
          <li><a href="#" data-tab="dashboard">Dashboard</a></li>
          <li><a href="#" data-tab="orders">My Orders</a></li>
          <li><a href="#" data-tab="address">My Address</a></li>
          <li><a href="#" data-tab="wishlist">Wishlist</a></li>
          <li><a href="#" data-tab="cart">My Cart</a></li>
          <li><a href="#" data-tab="account">Account Details</a></li>
        </ul>

        <button class="btn btn-sm" id="logoutBtn" style="margin-top:15px;">Logout</button>
      </div>

      <!-- Right content -->
      <div class="account-column">
        <h2 id="panelTitle">Dashboard</h2>
        <div id="panelBody">
          <p>Welcome! এখান থেকে তোমার account manage করতে পারবে.</p>
        </div>
      </div>

    </div>
  </div>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  // ✅ একই config (account/cart সব জায়গায় same)
  const firebaseConfig = {
    apiKey: "PASTE_HERE",
    authDomain: "PASTE_HERE",
    projectId: "PASTE_HERE",
    appId: "PASTE_HERE"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const userName = document.getElementById("userName");
  const userEmail = document.getElementById("userEmail");
  const panelTitle = document.getElementById("panelTitle");
  const panelBody = document.getElementById("panelBody");

  let currentUser = null;

  // ---------- Protect page ----------
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "account.html";
      return;
    }
    currentUser = user;

    userName.textContent = user.displayName || "Customer";
    userEmail.textContent = user.email || "";

    // Ensure profile doc exists
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, {
        name: user.displayName || "",
        email: user.email || "",
        phone: "",
        createdAt: Date.now()
      });
    }

    // default tab
    loadTab("dashboard");
  });

  // ---------- Logout ----------
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "account.html";
  });

  // ---------- Tabs ----------
  document.querySelectorAll("[data-tab]").forEach(a => {
    a.addEventListener("click", (e) => {
      e.preventDefault();
      loadTab(a.dataset.tab);
    });
  });

  async function loadTab(tab) {
    if (!currentUser) return;

    if (tab === "dashboard") {
      panelTitle.textContent = "Dashboard";
      panelBody.innerHTML = `
        <p>✅ Logged in as <strong>${currentUser.email}</strong></p>
        <p>এখানে order summary, cart count, wishlist count দেখাতে পারবে।</p>
      `;
    }

    if (tab === "orders") {
      panelTitle.textContent = "My Orders";
      panelBody.innerHTML = `<p>এখানে Firestore থেকে orders list show করবো (next step)।</p>`;
    }

    if (tab === "address") {
      panelTitle.textContent = "My Address";
      panelBody.innerHTML = `
        <p>এখানে shipping address add/edit হবে (Firestore)।</p>
        <p><small>Next step এ form + save করে দেবো।</small></p>
      `;
    }

    if (tab === "wishlist") {
      panelTitle.textContent = "Wishlist";
      panelBody.innerHTML = `<p>Wishlist items (Firestore) এখানে দেখাবে।</p>`;
    }

    if (tab === "cart") {
      panelTitle.textContent = "My Cart";
      panelBody.innerHTML = `
        <p>Cart দেখতে: <a href="cart.html">Open Cart Page</a></p>
        <p>(Cart Firestore sync তুমি আগেই শুরু করেছো)</p>
      `;
    }

    if (tab === "account") {
      panelTitle.textContent = "Account Details";
      panelBody.innerHTML = `
        <form id="profileForm">
          <div style="margin-bottom:10px;">
            <label>Name</label>
            <input id="pName" type="text" style="width:100%;" />
          </div>
          <div style="margin-bottom:10px;">
            <label>Phone</label>
            <input id="pPhone" type="text" style="width:100%;" />
          </div>
          <button class="btn btn-sm" type="submit">Save</button>
          <p id="saveMsg" style="margin-top:10px;"></p>
        </form>
      `;

      // load existing profile
      const ref = doc(db, "users", currentUser.uid);
      const snap = await getDoc(ref);
      const data = snap.data() || {};
      document.getElementById("pName").value = data.name || currentUser.displayName || "";
      document.getElementById("pPhone").value = data.phone || "";

      document.getElementById("profileForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        await setDoc(ref, {
          name: document.getElementById("pName").value.trim(),
          phone: document.getElementById("pPhone").value.trim(),
          email: currentUser.email
        }, { merge: true });
        document.getElementById("saveMsg").textContent = "Saved ✅";
      });
    }
  }
</script>
</body>
</html>
